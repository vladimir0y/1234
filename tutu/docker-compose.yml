# Local run of the whole product: http://localhost:8000
services:
  tutu:
    build: .
    ports: ["8000:8000"]
    environment:
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - POLLINATIONS_KEY=${POLLINATIONS_KEY:-}
      - AI_HORDE_API_KEY=${AI_HORDE_API_KEY:-}
      - TUTU_IMAGE_PROVIDERS=${TUTU_IMAGE_PROVIDERS:-auto}
    volumes:
      - tutu-data:/data
volumes:
  tutu-data:
