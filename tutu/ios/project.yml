# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Tutu
options:
  bundleIdPrefix: app.tutu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your Apple team id
targets:
  Tutu:
    type: application
    platform: iOS
    sources: [Tutu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tutu.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tutu
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера і LiDAR потрібні, щоб створити 3D-модель тіла для примірки тату."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Підключення до сервера Tutu у вашій мережі."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Tutu/Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
